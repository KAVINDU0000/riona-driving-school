services:
  postgres:
    image: postgres:17-alpine
    container_name: riona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: riona_db
      POSTGRES_USER: riona_user
      POSTGRES_PASSWORD: development_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
